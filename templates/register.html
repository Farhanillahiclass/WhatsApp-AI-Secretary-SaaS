{% extends "base.html" %}

{% block title %}Register - WhatsApp AI Secretary{% endblock %}

{% block auth_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fab fa-whatsapp"></i>
            <h1>Create Account</h1>
            <p>Start automating your WhatsApp</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Create a password" minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: 1rem;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-light);">
            <p style="color: var(--gray); font-size: 0.875rem;">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 500;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
